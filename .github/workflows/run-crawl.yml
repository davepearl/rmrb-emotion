name: Run News Crawler

on:
  schedule:
    - cron: '0 12 * * *'  # 每天 UTC 12:00 运行（北京时间 20:00）
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths: ['crawl.py', 'model.py']  # 确保这里和实际文件名一致

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 整个作业的超时时间

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg unzip
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache HuggingFace models
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-huggingface-

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Set environment variables
      run: |
        echo "HF_ENDPOINT=https://hf-mirror.com" >> $GITHUB_ENV
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV  # 让爬虫代码知道在Actions中运行

    - name: Run crawler
      timeout-minutes: 10
      run: |
        python crawl.py  # 确保这里文件名正确

    - name: Check if results exist
      run: |
        if [ -f news.pkl ]; then
          echo "✅ 爬虫运行成功，生成 news.pkl"
          # 如果生成CSV，可以添加检查
          # if [ -f news.csv ]; then
          #   echo "✅ 同时生成 news.csv"
          # fi
        else
          echo "❌ 未找到 news.pkl 文件"
          exit 1
        fi

    - name: Upload results
      uses: actions/upload-artifact@v4
      if: success()  # 只有成功时才上传
      with:
        name: news-data
        path: news.pkl
        retention-days: 7
