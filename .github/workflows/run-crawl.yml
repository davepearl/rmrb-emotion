# .github/workflows/run-crawl.yml
name: Run News Crawler

on:
  schedule:
    - cron: '0 12 * * *'  # 每天 UTC 12:00 运行（北京时间 20:00）
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths: ['crawler.py', 'model.py']

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写权限

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg unzip
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache HuggingFace models
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-huggingface-

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Set HF mirror for China
      run: echo "HF_ENDPOINT=https://hf-mirror.com" >> $GITHUB_ENV

    - name: Run crawler
      timeout-minutes: 10
      run: |
        python crawl.py

    - name: Commit and push news.pkl
      if: always()  # 即使爬虫失败也尝试提交
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # 先拉取最新代码，解决冲突（使用 rebase 策略）
        git pull origin main --rebase --autostash
        
        # 添加并提交文件
        git add news.pkl
        git commit -m "🤖 Auto-update news.pkl $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        
        # 推送更改
        git push origin main

    - name: Upload results as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: news-data
        path: news.pkl
        retention-days: 7
