name: Run News Crawler

on:
  schedule:
    - cron: '0 12 * * *'  # 每天 UTC 12:00 运行（北京时间 20:00）
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths: ['crawl.py', 'model.py']

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写权限来提交文件

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg unzip
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache HuggingFace models
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-huggingface-

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Set HF mirror for China
      run: echo "HF_ENDPOINT=https://hf-mirror.com" >> $GITHUB_ENV

    - name: Run crawler
      timeout-minutes: 10
      run: |
        python crawl.py

    - name: Check if file changed
      id: check_changes
      run: |
        if [ -f news.pkl ]; then
          echo "File exists, checking for changes..."
          # 检查文件是否有实际变化（简单方法：检查大小）
          file_size=$(stat -c%s news.pkl)
          echo "New file size: $file_size bytes"
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "No news.pkl generated"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 添加并提交文件
        git add news.pkl
        
        # 检查是否有更改需要提交
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-update news.pkl from GitHub Actions"
          git push
          echo "✅ Successfully updated news.pkl in repository"
        fi

    - name: Upload results as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: news-data
        path: news.pkl
        retention-days: 7
